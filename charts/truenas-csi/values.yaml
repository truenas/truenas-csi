# TrueNAS appliance connection.
truenas:
  # WebSocket URL of the TrueNAS API. Required.
  url: ""
  # Default ZFS pool for volumes. Required.
  defaultPool: ""
  # NFS server address. Derived from url when empty.
  nfsServer: ""
  # iSCSI portal (host:port). Derived from url when empty.
  iscsiPortal: ""
  # NVMe-oF portal (host:port). Derived from url when empty.
  nvmeofPortal: ""
  # Base IQN for iSCSI targets. The appliance's own basename wins when it differs.
  iscsiIQNBase: ""
  # Skip TLS verification. Needed for the self-signed certificate TrueNAS ships
  # with; leaving it false against a self-signed certificate leaves the pods
  # un-Ready with no obvious error.
  insecureSkipTLS: false

  # API key. Used only when existingSecret is empty, in which case the chart
  # creates the Secret itself.
  apiKey: ""
  # Name of a Secret you manage instead, for example one produced by
  # ExternalSecrets or Sealed Secrets. Any Secret type works.
  existingSecret: ""
  # Key inside existingSecret that holds the API key.
  existingSecretKey: api-key

# CSI driver name. Change it, along with fullnameOverride, to run more than one
# instance in a cluster against different appliances. It is part of the kubelet
# socket path, so it must match the CSIDriver object, which this chart keeps in
# step automatically.
driverName: csi.truenas.io

# Kubelet root directory. K3s and MicroK8s put it elsewhere:
#   K3s      /var/lib/kubelet
#   MicroK8s /var/snap/microk8s/common/var/lib/kubelet
kubeletDir: /var/lib/kubelet

# Namespace creation. Helm normally leaves this to `--create-namespace`.
namespace:
  create: false

nameOverride: ""
fullnameOverride: ""

# Driver log verbosity (klog -v).
logLevel: 4

image:
  driver:
    repository: ghcr.io/truenas/truenas-csi
    # Defaults to v<appVersion>, the tag the release publishes.
    tag: ""
    pullPolicy: IfNotPresent
  csiProvisioner:
    repository: registry.k8s.io/sig-storage/csi-provisioner
    tag: v6.1.1
    pullPolicy: ""
  csiAttacher:
    repository: registry.k8s.io/sig-storage/csi-attacher
    tag: v4.11.0
    pullPolicy: ""
  csiSnapshotter:
    repository: registry.k8s.io/sig-storage/csi-snapshotter
    tag: v8.5.0
    pullPolicy: ""
  csiResizer:
    repository: registry.k8s.io/sig-storage/csi-resizer
    tag: v2.1.0
    pullPolicy: ""
  nodeDriverRegistrar:
    repository: registry.k8s.io/sig-storage/csi-node-driver-registrar
    tag: v2.16.0
    pullPolicy: ""
  livenessProbe:
    repository: registry.k8s.io/sig-storage/livenessprobe
    tag: v2.18.0
    pullPolicy: ""

imagePullSecrets: []

# Health port served by the livenessprobe sidecar in both workloads.
healthPort: 9808

rbac:
  create: true

serviceAccount:
  create: true
  # Names default to <fullname>-controller-sa and <fullname>-node-sa.
  controller: ""
  node: ""

controller:
  replicas: 1
  # Sidecar timeout for CSI calls. Volume creation waits on ZFS.
  timeout: 60s
  # Filesystem the provisioner asks for when a StorageClass names none.
  defaultFSType: ext4
  # extraEnvVars is a list of additional environment variables to set in the controller pod, on the csi-controller container.
  # This is useful for setting proxy environment variables, for example.
  extraEnvVars: []
  # extraVolumes and extraVolumeMounts are lists of additional volumes and volume mounts to set in the controller pod, on the csi-controller container.
  # This is useful for mounting a Secret or ConfigMap, maybe for a Root CA for example.
  extraVolumes: []
  extraVolumeMounts: []
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 200m
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podLabels: {}
  priorityClassName: ""

node:
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 200m
  nodeSelector: {}
  # Run everywhere by default: a node that cannot mount volumes cannot run
  # workloads that need them.
  tolerations:
    - operator: Exists
  podAnnotations: {}
  podLabels: {}
  priorityClassName: system-node-critical

# Prometheus metrics. See docs/metrics.md.
metrics:
  # Serve /metrics from the controller.
  enabled: false
  port: 8080
  node:
    # Serve /metrics from the node plugin. The node pods use hostNetwork, so
    # this port is bound on every node in the cluster.
    enabled: false
    port: 8080
  service:
    # Created when metrics.enabled is true.
    annotations: {}
  serviceMonitor:
    # Requires the Prometheus Operator CRDs.
    enabled: false
    interval: 30s
    scrapeTimeout: ""
    # Labels the Prometheus instance selects ServiceMonitors by, for example
    # release: kube-prometheus-stack.
    labels: {}
  # CSI sidecar metrics (csi_sidecar_operations_seconds). Each sidecar in the
  # controller pod needs its own port.
  sidecars:
    enabled: true
    provisionerPort: 8081
    attacherPort: 8082
    snapshotterPort: 8083
    resizerPort: 8084

# StorageClasses to create. parameters are passed to the driver verbatim; see
# the StorageClass parameter reference in the README.
# Example:
#   storageClasses:
#     - name: truenas-nfs
#       isDefault: true
#       reclaimPolicy: Delete
#       allowVolumeExpansion: true
#       volumeBindingMode: Immediate
#       mountOptions: []
#       parameters:
#         protocol: nfs
#         compression: LZ4
storageClasses: []

volumeSnapshotClass:
  enabled: false
  name: truenas-snapshotclass
  deletionPolicy: Delete
  annotations: {}
  parameters: {}

# Extra manifests to install with the chart, rendered as templates. Useful for
# an ExternalSecret that produces truenas.existingSecret.
extraObjects: []
